      or CID; generations are context. Wi-Fi CERTIFIED does not expire and the finder marks nothing withdrawn, so
      lapsed is false
    detected_by: sweep-wireless-connectivity-certification.py
    detected: '2026-10-22'
    identity_source: register-name
    identity_note: register gave only the name; exact normalised match to the repo's apis.yml name, one repo, Wikidata
