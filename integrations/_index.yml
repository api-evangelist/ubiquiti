  type: register
  channel: standard-directory
  evidence: https://www.wi-fi.org/product-finder
  source: edge
  relationship: standard-participant
  contract_reference:
    register: Wi-Fi Alliance product finder (wi-fi.org/product-finder; prf.cert.wi-fi.org public JSON / CSV)
    standard: Wi-Fi CERTIFIED
    spec_file: null
    role: wi-fi-certified-product
    registered_name: Ubiquiti Inc.
    register_id: WFA131610
    matched_domain: null
    matched_by: register-name
    register_name_note: register-name 'ubiquiti' = ubiquiti; no wikidata P856
    certified_products:
    - product: Routers
      lapsed: false
      newest_certification: '2024-07-01'
      generations:
      - Wi-Fi 7
      - Wi-Fi 6
      - Wi-Fi 5 (ac)
      - Wi-Fi 4 (n)
    - product: Televisions & Set Top Boxes
      lapsed: false
      newest_certification: '2024-10-01'
      generations:
      - Wi-Fi 7
      - Wi-Fi 6
      - Wi-Fi 5 (ac)
      - Wi-Fi 4 (n)
    products_sample:
    - UniFi AP
    - UniFi AP-Professional
    - UniFi Access Point AC In-Wall
    - UniFi Access Point AC Lite
    - UniFi Access Point AC Mesh
    - UniFi Access Point AC Mesh PRO
    - UniFi Access Point AC PRO
    - UniFi Display Cast Lite
